services:
  trmnl_db:
    image: postgres:16-alpine
    container_name: trmnl_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=byos_db
    volumes:
      - trmnl_db_data:/var/lib/postgresql/data
    networks:
      - trmnl_db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  trmnl_app:
    # image: ghcr.io/usetrmnl/byos_next:latest
    container_name: trmnl_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3777:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@trmnl_db:5432/byos_db?sslmode=disable
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3777}
    depends_on:
      trmnl_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - trmnl_network
      - trmnl_db_network

volumes:
  trmnl_db_data:
    driver: local

networks:
  trmnl_network:
    driver: bridge
  trmnl_db_network:
    driver: bridge
    internal: true
